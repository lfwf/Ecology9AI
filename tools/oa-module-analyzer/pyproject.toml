[project]
name = "oa-module-analyzer"
version = "0.1.0"
description = "Offline, evidence-preserving parser for Weaver form-model module exports"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
edesign = ["cryptography>=41"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
oa-module-analyzer = "analyze_module:main"

[tool.setuptools]
py-modules = ["analyze_module"]
