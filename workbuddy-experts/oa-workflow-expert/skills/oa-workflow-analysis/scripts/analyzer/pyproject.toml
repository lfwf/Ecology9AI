[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-workflow-analyzer"
version = "0.1.0"
description = "Offline, evidence-first analysis of Weaver workflow exports"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "cryptography>=41"]

[project.optional-dependencies]
pdf = ["reportlab>=4"]
test = ["jsonschema>=4.18"]

[project.scripts]
oa-workflow = "oa_workflow_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oa_workflow_analyzer = ["schemas/*.json"]
